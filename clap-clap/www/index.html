<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Clap! Clap!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#FFD93D;
    --sky:#FFF6DE;
    --coral:#FF6B6B;
    --teal:#38C9B0;
    --plum:#3D2B56;
    --white:#FFFFFF;
    --shadow:rgba(61,43,86,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Fredoka',system-ui,sans-serif;
    background:var(--sky);
    color:var(--plum);
    display:flex;align-items:center;justify-content:center;
  }
  #app{
    width:100%;max-width:440px;height:100%;max-height:900px;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
  }

  /* ---------- screens ---------- */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity .25s ease, transform .25s ease;z-index:6;background:var(--sky)}
  .screen.hidden{opacity:0;pointer-events:none;transform:scale(.96)}

  h1.logo{font-size:clamp(44px,13vw,64px);font-weight:700;line-height:1;letter-spacing:-1px}
  h1.logo .c1{color:var(--coral)} h1.logo .c2{color:var(--teal)}
  .tag{margin-top:10px;font-size:17px;font-weight:400;max-width:290px;line-height:1.45}

  .howto{margin:24px 0 4px;display:flex;gap:12px}
  .howto .step{background:var(--white);border-radius:20px;padding:13px 9px;width:96px;box-shadow:0 4px 0 var(--shadow);font-size:13px;font-weight:600;line-height:1.3}
  .howto .step .em{font-size:26px;display:block;margin-bottom:6px;font-weight:700}
  .howto .step .em.r{color:var(--coral)}
  .howto .step .em.l{color:var(--teal)}
  .howto .step .em.b{color:var(--plum)}

  .cyclebox{margin-top:20px}
  .cyclebox .lbl{font-size:12px;font-weight:700;letter-spacing:2px;opacity:.6}
  .chips{display:flex;gap:8px;margin-top:8px;justify-content:center}
  .chip{border:none;font-family:inherit;font-weight:700;font-size:17px;width:42px;height:42px;border-radius:14px;background:var(--white);color:var(--plum);box-shadow:0 3px 0 var(--shadow);cursor:pointer}
  .chip.sel{background:var(--plum);color:var(--white)}
  .cyclehint{margin-top:9px;font-size:13px;opacity:.65;min-height:17px}

  .btn{
    margin-top:24px;border:none;cursor:pointer;font-family:inherit;
    font-size:22px;font-weight:700;color:var(--white);
    background:var(--coral);padding:16px 58px;border-radius:26px;
    box-shadow:0 6px 0 #d94f4f;transition:transform .08s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d94f4f}
  .btn.teal{background:var(--teal);box-shadow:0 6px 0 #279e8a}
  .btn.teal:active{box-shadow:0 2px 0 #279e8a}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;z-index:5;pointer-events:none;opacity:0;transition:opacity .3s}
  #hud.on{opacity:1}
  .hudbox{background:var(--white);border-radius:16px;padding:7px 15px;box-shadow:0 3px 0 var(--shadow);font-weight:700;font-size:18px}
  .hudbox small{display:block;font-size:10px;letter-spacing:1.5px;font-weight:600;opacity:.55}

  /* ---------- stage ---------- */
  #stage{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .3s}
  #stage.on{opacity:1;pointer-events:auto}
  #stage.shake{animation:shake .18s ease}
  @keyframes shake{25%{transform:translate(1.5px,-1px)}55%{transform:translate(-1.5px,1px)}85%{transform:translate(1px,.5px)}}

  /* depth: warm room gradient, darker vignette at edges, lighter where you stand */
  #depth{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 108%, rgba(255,217,61,.25), transparent 55%),
      radial-gradient(140% 110% at 50% -20%, rgba(61,43,86,.10), transparent 60%),
      linear-gradient(to bottom, #FBEECB 0%, var(--sky) 42%, #FFF9E9 100%);
  }

  /* ---------- opponent (torso + face, behind their hands) ---------- */
  #rival{position:absolute;top:-2%;left:50%;transform:translateX(-50%);width:72%;max-width:320px;z-index:1;pointer-events:none}
  #rival svg{width:100%;height:auto;display:block}
  #rival .sway{animation:sway 3.4s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes sway{50%{transform:rotate(1.4deg)}}

  /* prompt */
  #promptWrap{position:absolute;top:37%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:2;pointer-events:none}
  #prompt{font-size:clamp(42px,13vw,64px);font-weight:700;letter-spacing:-1px;transition:transform .1s;text-shadow:0 2px 0 rgba(255,255,255,.7)}
  #prompt.right{color:var(--coral)} #prompt.left{color:var(--teal)} #prompt.both{color:var(--plum)}
  #prompt.pop{transform:scale(1.14)}
  #timebar{width:150px;height:9px;border-radius:5px;background:rgba(61,43,86,.14);margin:8px auto 0;overflow:hidden}
  #timefill{height:100%;width:100%;border-radius:5px;background:var(--sun);transform-origin:left}

  #cycledots{display:flex;gap:7px;justify-content:center;margin-top:10px}
  #cycledots .d{width:11px;height:11px;border-radius:50%;background:rgba(61,43,86,.16);transition:background .15s,transform .15s}
  #cycledots .d.now{transform:scale(1.35)}
  #cycledots .d.now.r{background:var(--coral)}
  #cycledots .d.now.l{background:var(--teal)}
  #cycledots .d.bd{width:15px;height:15px;border:2px solid var(--plum);background:transparent}
  #cycledots .d.bd.now{background:var(--plum)}

  /* ---------- hands ---------- */
  .hand{position:absolute;z-index:3;transition:transform .17s cubic-bezier(.33,1.12,.6,1);will-change:transform;pointer-events:none}
  .hand svg{width:100%;height:auto;display:block}

  /* opponent hands: smaller (farther away), palms facing you, fingers up */
  .hand.op{width:27%;max-width:122px}
  .hand.op svg{filter:drop-shadow(0 4px 5px rgba(61,43,86,.20))}
  .hand.op .bob{animation:bobOp 2.6s ease-in-out infinite}
  @keyframes bobOp{50%{transform:translateY(-6px)}}

  /* your hands: big foreground POV hands seen from the back, wrists running off-screen */
  .hand.me{width:54%;max-width:245px}
  .hand.me svg{filter:drop-shadow(0 10px 14px rgba(61,43,86,.28))}
  .hand.me .bob{animation:bobMe 2.6s ease-in-out infinite}
  @keyframes bobMe{50%{transform:translateY(8px)}}

  .hand.me{--skin:#EAB08A;--skin-hi:#F7CBA7;--skin-ln:#B97E52;--skin-nail:#F9DDC2}
  .hand.op{--skin:#C98B62;--skin-hi:#DFA87E;--skin-ln:#96603C}

  /* your right hand appears bottom-right, your left bottom-left, both tilted inward
     and pitched away from you with a slight perspective */
  #handPR{bottom:-16%;right:-7%;transform:perspective(700px) rotateX(16deg) rotate(-13deg)}
  #handPL{bottom:-16%;left:-7%;transform:perspective(700px) rotateX(16deg) rotate(13deg) scaleX(-1)}
  /* their right hand is on YOUR left, and vice versa */
  #handOR{top:15%;left:11%;transform:rotate(-5deg) scaleX(-1)}
  #handOL{top:15%;right:11%;transform:rotate(5deg)}

  /* clap burst */
  .burst{position:absolute;z-index:4;pointer-events:none;transform:translate(-50%,-50%)}
  .burst svg{animation:burstAnim .34s ease-out forwards}
  @keyframes burstAnim{0%{transform:scale(.35);opacity:.85}100%{transform:scale(1.05);opacity:0}}
  .clapword{position:absolute;z-index:4;pointer-events:none;transform:translate(-50%,-50%);font-weight:700;font-size:17px;color:var(--plum);opacity:.85;animation:wordAnim .45s ease-out forwards}
  @keyframes wordAnim{0%{transform:translate(-50%,-50%) scale(.5) rotate(-4deg);opacity:0}30%{opacity:.85}100%{transform:translate(-50%,-105%) scale(1) rotate(3deg);opacity:0}}

  /* tap zones (sit above hands visually; hands never take pointer events) */
  #zones{position:absolute;inset:0;display:flex;z-index:4}
  .zone{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:24px}
  .zone .hint{font-size:12px;font-weight:700;letter-spacing:2px;opacity:.55;background:var(--white);padding:5px 13px;border-radius:12px;transition:opacity .3s;box-shadow:0 2px 0 var(--shadow)}
  #stage.nohints .hint{opacity:0}
  .zone.flash-ok{background:radial-gradient(circle at center, rgba(56,201,176,.16), transparent 70%)}
  .zone.flash-bad{background:radial-gradient(circle at center, rgba(255,107,107,.26), transparent 70%)}

  /* game over */
  #overScore{font-size:70px;font-weight:700;color:var(--coral);line-height:1}
  #overLbl{font-size:13px;font-weight:700;letter-spacing:2px;opacity:.6;margin-top:4px}
  #overReason{margin-top:14px;font-size:18px;font-weight:600}
  #overBest{margin-top:6px;font-size:15px;opacity:.7}

  @media (prefers-reduced-motion: reduce){
    .hand .bob,#rival .sway{animation:none}
    #stage.shake{animation:none}
  }
</style>
</head>
<body>
<div id="app">

  <!-- shared artwork -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- palm side: what you see of your OPPONENT's hands -->
      <symbol id="handPalm" viewBox="0 0 200 270">
        <rect x="72" y="206" width="76" height="64" rx="22" fill="var(--skin)"/>
        <rect x="4" y="116" width="31" height="96" rx="15.5" fill="var(--skin)" transform="rotate(-33 20 164)"/>
        <path d="M38 136 Q26 174 54 202 L76 190 Q52 168 58 134 Z" fill="var(--skin)"/>
        <rect x="55" y="26" width="27" height="112" rx="13.5" fill="var(--skin)" transform="rotate(-4 68.5 82)"/>
        <rect x="87" y="12" width="28" height="126" rx="14" fill="var(--skin)"/>
        <rect x="118" y="22" width="26" height="118" rx="13" fill="var(--skin)" transform="rotate(3 131 81)"/>
        <rect x="146" y="47" width="22" height="96" rx="11" fill="var(--skin)" transform="rotate(7 157 95)"/>
        <rect x="50" y="98" width="122" height="124" rx="34" fill="var(--skin)"/>
        <ellipse cx="112" cy="160" rx="52" ry="46" fill="var(--skin-hi)" opacity=".55"/>
        <g fill="var(--skin-hi)" opacity=".45">
          <ellipse cx="69" cy="43" rx="9" ry="12"/>
          <ellipse cx="101" cy="29" rx="9.5" ry="13"/>
          <ellipse cx="131" cy="39" rx="9" ry="12"/>
          <ellipse cx="157" cy="61" rx="7.5" ry="10"/>
        </g>
        <g stroke="var(--skin-ln)" stroke-linecap="round" fill="none">
          <path d="M70 132 Q100 150 148 138" stroke-width="3" opacity=".5"/>
          <path d="M66 152 Q98 172 150 158" stroke-width="3" opacity=".45"/>
          <path d="M76 212 Q62 182 80 150" stroke-width="3" opacity=".4"/>
          <g stroke-width="2.4" opacity=".42">
            <path d="M60 66 q10 4 20 0"/><path d="M60 96 q10 4 20 0"/>
            <path d="M91 52 q11 4 21 0"/><path d="M91 86 q11 4 21 0"/>
            <path d="M121 60 q10 4 20 0"/><path d="M121 92 q10 4 20 0"/>
            <path d="M148 82 q9 4 18 0"/><path d="M148 106 q9 4 18 0"/>
          </g>
          <path d="M80 224 q22 8 44 0" stroke-width="2.6" opacity=".35"/>
        </g>
      </symbol>

      <!-- back of hand: what you see of YOUR OWN hands while holding the phone -->
      <symbol id="handBack" viewBox="0 0 200 270">
        <rect x="72" y="206" width="76" height="64" rx="22" fill="var(--skin)"/>
        <rect x="4" y="116" width="31" height="96" rx="15.5" fill="var(--skin)" transform="rotate(-33 20 164)"/>
        <path d="M38 136 Q26 174 54 202 L76 190 Q52 168 58 134 Z" fill="var(--skin)"/>
        <rect x="55" y="26" width="27" height="112" rx="13.5" fill="var(--skin)" transform="rotate(-4 68.5 82)"/>
        <rect x="87" y="12" width="28" height="126" rx="14" fill="var(--skin)"/>
        <rect x="118" y="22" width="26" height="118" rx="13" fill="var(--skin)" transform="rotate(3 131 81)"/>
        <rect x="146" y="47" width="22" height="96" rx="11" fill="var(--skin)" transform="rotate(7 157 95)"/>
        <rect x="50" y="98" width="122" height="124" rx="34" fill="var(--skin)"/>
        <!-- soft sheen across the back of the hand -->
        <ellipse cx="105" cy="150" rx="56" ry="50" fill="var(--skin-hi)" opacity=".4"/>
        <!-- fingernails -->
        <g fill="var(--skin-nail)" stroke="var(--skin-ln)" stroke-width="1.6">
          <rect x="61" y="32" width="16" height="19" rx="7" transform="rotate(-4 69 41)"/>
          <rect x="93" y="18" width="17" height="20" rx="7.5"/>
          <rect x="123" y="28" width="16" height="19" rx="7" transform="rotate(3 131 37)"/>
          <rect x="150" y="51" width="14" height="17" rx="6.5" transform="rotate(7 157 59)"/>
          <ellipse cx="14" cy="132" rx="8" ry="10" transform="rotate(-33 14 132)"/>
        </g>
        <!-- knuckles at the finger bases -->
        <g stroke="var(--skin-ln)" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".45">
          <path d="M61 122 q9 -7 18 0"/>
          <path d="M92 116 q10 -7 19 0"/>
          <path d="M123 120 q9 -7 18 0"/>
          <path d="M149 128 q8 -6 16 0"/>
        </g>
        <!-- finger joint creases (from the back) -->
        <g stroke="var(--skin-ln)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".35">
          <path d="M61 68 q10 -4 20 0"/><path d="M61 96 q10 -4 20 0"/>
          <path d="M92 54 q11 -4 21 0"/><path d="M92 88 q11 -4 21 0"/>
          <path d="M122 62 q10 -4 20 0"/><path d="M122 94 q10 -4 20 0"/>
          <path d="M149 84 q9 -4 18 0"/><path d="M149 108 q9 -4 18 0"/>
        </g>
        <!-- tendons fanning from the wrist to the knuckles -->
        <g stroke="var(--skin-ln)" stroke-width="2" stroke-linecap="round" fill="none" opacity=".22">
          <path d="M96 214 Q80 170 70 128"/>
          <path d="M104 214 Q98 168 100 122"/>
          <path d="M112 214 Q118 168 130 126"/>
          <path d="M120 216 Q136 176 154 134"/>
        </g>
      </symbol>

      <symbol id="burstShape" viewBox="0 0 120 120">
        <g fill="var(--sun)" stroke="#F2C043" stroke-width="2" stroke-linejoin="round" opacity=".9">
          <path d="M60 4 L70 38 L104 26 L82 54 L116 60 L82 66 L104 94 L70 82 L60 116 L50 82 L16 94 L38 66 L4 60 L38 54 L16 26 L50 38 Z"/>
        </g>
        <circle cx="60" cy="60" r="16" fill="#FFF6DE" stroke="#F2C043" stroke-width="2"/>
      </symbol>
    </defs>
  </svg>

  <!-- ============ START SCREEN ============ -->
  <div class="screen" id="scrStart">
    <h1 class="logo"><span class="c1">Clap!</span> <span class="c2">Clap!</span></h1>
    <p class="tag">Your hands. Their hands. Match the rhythm — don't miss a clap!</p>
    <div class="howto">
      <div class="step"><span class="em r">R</span>Tap the RIGHT side</div>
      <div class="step"><span class="em l">L</span>Tap the LEFT side</div>
      <div class="step"><span class="em b">R+L</span>Tap BOTH together</div>
    </div>
    <div class="cyclebox">
      <div class="lbl">CLAP CYCLE</div>
      <div class="chips" id="chips">
        <button class="chip sel" data-n="3">3</button>
        <button class="chip" data-n="4">4</button>
        <button class="chip" data-n="5">5</button>
        <button class="chip" data-n="6">6</button>
        <button class="chip" data-n="7">7</button>
      </div>
      <div class="cyclehint" id="cycleHint">Right, Left, then BOTH on clap 3</div>
    </div>
    <button class="btn" id="startBtn">Play</button>
  </div>

  <!-- ============ GAME ============ -->
  <div id="hud">
    <div class="hudbox"><small>SCORE</small><span id="score">0</span></div>
    <div class="hudbox"><small>BEST</small><span id="best">0</span></div>
  </div>

  <div id="stage">
    <div id="depth"></div>

    <!-- the rival standing across from you -->
    <div id="rival"><div class="sway">
      <svg viewBox="0 0 300 210">
        <!-- shoulders / shirt -->
        <path d="M42 210 C42 150 90 122 150 122 C210 122 258 150 258 210 Z" fill="var(--teal)"/>
        <path d="M42 210 C42 150 90 122 150 122 C210 122 258 150 258 210 Z" fill="rgba(61,43,86,.08)"/>
        <!-- neck -->
        <rect x="134" y="96" width="32" height="34" rx="12" fill="#C98B62"/>
        <!-- head -->
        <circle cx="150" cy="62" r="50" fill="#C98B62"/>
        <ellipse cx="138" cy="52" rx="30" ry="26" fill="#DFA87E" opacity=".45"/>
        <!-- hair -->
        <path d="M100 58 C100 22 124 8 150 8 C176 8 200 22 200 58 C200 44 184 30 150 30 C116 30 100 44 100 58 Z" fill="var(--plum)"/>
        <!-- face -->
        <circle cx="132" cy="62" r="5" fill="var(--plum)"/>
        <circle cx="168" cy="62" r="5" fill="var(--plum)"/>
        <path d="M136 82 Q150 92 164 82" stroke="var(--plum)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <ellipse cx="118" cy="76" rx="7" ry="5" fill="var(--coral)" opacity=".35"/>
        <ellipse cx="182" cy="76" rx="7" ry="5" fill="var(--coral)" opacity=".35"/>
      </svg>
    </div></div>

    <div id="promptWrap">
      <div id="prompt" class="right">RIGHT</div>
      <div id="timebar"><div id="timefill"></div></div>
      <div id="cycledots"></div>
    </div>

    <!-- opponent's raised palms, facing you -->
    <div class="hand op" id="handOR"><div class="bob"><svg viewBox="0 0 200 270"><use href="#handPalm"/></svg></div></div>
    <div class="hand op" id="handOL"><div class="bob"><svg viewBox="0 0 200 270"><use href="#handPalm"/></svg></div></div>
    <!-- your own hands in the foreground, seen from the back -->
    <div class="hand me" id="handPR"><div class="bob"><svg viewBox="0 0 200 270"><use href="#handBack"/></svg></div></div>
    <div class="hand me" id="handPL"><div class="bob"><svg viewBox="0 0 200 270"><use href="#handBack"/></svg></div></div>

    <div id="zones">
      <div class="zone" id="zoneL"><span class="hint">LEFT HAND</span></div>
      <div class="zone" id="zoneR"><span class="hint">RIGHT HAND</span></div>
    </div>
  </div>

  <!-- ============ GAME OVER ============ -->
  <div class="screen hidden" id="scrOver">
    <div id="overScore">0</div>
    <div id="overLbl">CLAPS</div>
    <div id="overReason">Wrong hand!</div>
    <div id="overBest">Best this session: 0</div>
    <button class="btn teal" id="againBtn">Play again</button>
  </div>

</div>

<script>
(function(){
  'use strict';

  // ---------- elements ----------
  const $ = id => document.getElementById(id);
  const scrStart=$('scrStart'), scrOver=$('scrOver'), stage=$('stage'), hud=$('hud');
  const promptEl=$('prompt'), timefill=$('timefill'), dotsEl=$('cycledots');
  const scoreEl=$('score'), bestEl=$('best');
  const zoneL=$('zoneL'), zoneR=$('zoneR');
  const hands={
    pR:$('handPR'), pL:$('handPL'), oR:$('handOR'), oL:$('handOL')
  };
  // base transform per hand; the plain rotate() token gets swapped during claps
  const baseT={
    pR:'perspective(700px) rotateX(16deg) rotate(-13deg)',
    pL:'perspective(700px) rotateX(16deg) rotate(13deg) scaleX(-1)',
    oR:'rotate(-5deg) scaleX(-1)',
    oL:'rotate(5deg)'
  };

  // ---------- game constants ----------
  const LABEL={right:'RIGHT',left:'LEFT',both:'BOTH'};
  const START_WINDOW=2000, MIN_WINDOW=520, DECAY=0.965, BOTH_GRACE=260, SINGLE_GRACE=110;

  // ---------- state ----------
  let cycleN=3;
  let playing=false, moveIdx=0, score=0, best=0, windowMs=START_WINDOW;
  let failTimer=null, barRAF=null, windowStart=0;
  let pendingSide=null, pendingTimer=null, locked=false;
  let singleSide=null, singleTimer=null;

  function moveAt(i){
    const pos=i%cycleN;
    if(pos===cycleN-1) return 'both';
    return pos%2===0 ? 'right' : 'left';
  }

  // ---------- audio ----------
  let ac=null;
  function ensureAudio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); }
  function playClap(both){
    if(!ac) return;
    const t=ac.currentTime;
    const len=0.09, buf=ac.createBuffer(1, ac.sampleRate*len, ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2); }
    const src=ac.createBufferSource(); src.buffer=buf;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=both?900:1400; bp.Q.value=.8;
    const g=ac.createGain(); g.gain.setValueAtTime(both?.4:.3,t); g.gain.exponentialRampToValueAtTime(.001,t+len);
    src.connect(bp).connect(g).connect(ac.destination); src.start(t);
    if(both){
      const src2=ac.createBufferSource(); src2.buffer=buf;
      const g2=ac.createGain(); g2.gain.setValueAtTime(.28,t+.03); g2.gain.exponentialRampToValueAtTime(.001,t+.03+len);
      src2.connect(bp).connect(g2); src2.start(t+.03);
    }
  }
  function playFail(){
    if(!ac) return;
    const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(110,t+.28);
    g.gain.setValueAtTime(.14,t); g.gain.exponentialRampToValueAtTime(.001,t+.32);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+.34);
  }

  // ---------- cycle selector ----------
  $('chips').addEventListener('click', e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
    b.classList.add('sel');
    cycleN=+b.dataset.n;
    $('cycleHint').textContent = cycleN===3
      ? 'Right, Left, then BOTH on clap 3'
      : 'Alternate R and L, BOTH on clap '+cycleN;
  });

  function buildDots(){
    dotsEl.innerHTML='';
    for(let i=0;i<cycleN;i++){
      const d=document.createElement('div');
      d.className='d'+(i===cycleN-1?' bd':'');
      dotsEl.appendChild(d);
    }
  }
  function updateDots(){
    const pos=moveIdx%cycleN, mv=moveAt(moveIdx);
    [...dotsEl.children].forEach((d,i)=>{
      d.classList.remove('now','r','l');
      if(i===pos){ d.classList.add('now'); if(mv==='right')d.classList.add('r'); if(mv==='left')d.classList.add('l'); }
    });
  }

  // ---------- hand choreography ----------
  function stagePoint(px,py){
    const r=stage.getBoundingClientRect();
    return {x:r.left+r.width*px, y:r.top+r.height*py};
  }
  // move a hand so its center lands on target, swap in a new rotation, and
  // scale for depth: your hands shrink as they reach away, theirs grow as they reach toward you
  function moveHandTo(key, target, rot, scale){
    const el=hands[key], r=el.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    el.style.transform = 'translate('+(target.x-cx)+'px,'+(target.y-cy)+'px) '
      + baseT[key].replace(/rotate\([^)]*\)/,'rotate('+rot+'deg)')
      + ' scale('+scale+')';
  }
  function resetHand(key){ hands[key].style.transform=baseT[key]; }

  function spawnBurst(pt, word){
    const app=document.getElementById('app'), appR=app.getBoundingClientRect();
    const b=document.createElement('div');
    b.className='burst';
    b.style.left=(pt.x-appR.left)+'px'; b.style.top=(pt.y-appR.top)+'px';
    b.innerHTML='<svg width="62" height="62" viewBox="0 0 120 120"><use href="#burstShape"/></svg>';
    app.appendChild(b);
    const w=document.createElement('div');
    w.className='clapword'; w.textContent=word;
    w.style.left=(pt.x-appR.left)+'px'; w.style.top=(pt.y-appR.top-46)+'px';
    app.appendChild(w);
    setTimeout(()=>{b.remove();w.remove();},520);
  }

  function clapAnim(mv){
    stage.classList.add('shake');
    setTimeout(()=>stage.classList.remove('shake'),200);
    if(mv==='right'){
      // your right hand reaches away to meet THEIR right (coming from your left)
      const pt=stagePoint(.5,.55);
      moveHandTo('pR',{x:pt.x+14,y:pt.y+52},-17,.9);
      moveHandTo('oR',{x:pt.x-12,y:pt.y-40},-10,1.14);
      spawnBurst(pt,'CLAP!');
    }else if(mv==='left'){
      const pt=stagePoint(.5,.55);
      moveHandTo('pL',{x:pt.x-14,y:pt.y+52},17,.9);
      moveHandTo('oL',{x:pt.x+12,y:pt.y-40},10,1.14);
      spawnBurst(pt,'CLAP!');
    }else{
      // both: straight-ahead double clap — your right meets their left and vice versa
      const ptR=stagePoint(.71,.54), ptL=stagePoint(.29,.54);
      moveHandTo('pR',{x:ptR.x,y:ptR.y+50},-5,.91);
      moveHandTo('oL',{x:ptR.x,y:ptR.y-38},2,1.12);
      moveHandTo('pL',{x:ptL.x,y:ptL.y+50},5,.91);
      moveHandTo('oR',{x:ptL.x,y:ptL.y-38},-2,1.12);
      spawnBurst(ptR,'CLAP!'); spawnBurst(ptL,'CLAP!');
    }
    playClap(mv==='both');
    setTimeout(()=>{ Object.keys(hands).forEach(resetHand); },190);
  }

  // ---------- timing bar ----------
  function startBar(){
    windowStart=performance.now();
    cancelAnimationFrame(barRAF);
    (function tick(){
      const p=Math.max(0,1-(performance.now()-windowStart)/windowMs);
      timefill.style.transform='scaleX('+p+')';
      timefill.style.background = p<.35 ? 'var(--coral)' : 'var(--sun)';
      if(p>0&&playing) barRAF=requestAnimationFrame(tick);
    })();
  }

  // ---------- game flow ----------
  function showMove(){
    const mv=moveAt(moveIdx);
    promptEl.textContent=LABEL[mv];
    promptEl.className=mv;
    promptEl.classList.add('pop');
    setTimeout(()=>promptEl.classList.remove('pop'),110);
    updateDots();
    clearTimeout(failTimer);
    failTimer=setTimeout(()=>fail('Too slow!'), windowMs);
    startBar();
  }

  function success(){
    const mv=moveAt(moveIdx);
    clearTimeout(failTimer); clearTimeout(pendingTimer);
    pendingSide=null; locked=true;
    clapAnim(mv);
    score++; scoreEl.textContent=score;
    if(score>3) stage.classList.add('nohints');
    windowMs=Math.max(MIN_WINDOW, windowMs*DECAY);
    moveIdx++;
    setTimeout(()=>{ locked=false; if(playing) showMove(); }, 300);
  }

  function fail(reason){
    if(!playing) return;
    playing=false; locked=true;
    clearTimeout(failTimer); clearTimeout(pendingTimer);
    clearTimeout(singleTimer); singleSide=null;
    cancelAnimationFrame(barRAF);
    playFail();
    flashZone(zoneL,'flash-bad'); flashZone(zoneR,'flash-bad');
    best=Math.max(best,score); bestEl.textContent=best;
    $('overScore').textContent=score;
    $('overReason').textContent=reason;
    $('overBest').textContent='Best this session: '+best;
    setTimeout(()=>{
      stage.classList.remove('on'); hud.classList.remove('on');
      scrOver.classList.remove('hidden');
    },450);
  }

  function flashZone(z,cls){
    z.classList.add(cls);
    setTimeout(()=>z.classList.remove(cls),220);
  }

  // ---------- input ----------
  function input(side){
    if(!playing||locked) return;
    const mv=moveAt(moveIdx);
    if(mv==='both'){
      if(pendingSide===null){
        pendingSide=side;
        flashZone(side==='left'?zoneL:zoneR,'flash-ok');
        pendingTimer=setTimeout(()=>{ pendingSide=null; fail('You needed BOTH hands!'); }, BOTH_GRACE);
      }else if(pendingSide!==side){
        flashZone(side==='left'?zoneL:zoneR,'flash-ok');
        success();
      }
      return;
    }
    // single-hand move: hold a brief grace window so a two-handed
    // tap registers as a mistake instead of a lucky clap
    if(singleSide!==null){
      if(side!==singleSide){
        clearTimeout(singleTimer); singleSide=null;
        fail('Just one hand! It was '+LABEL[mv]+'.');
      }
      return;
    }
    if(side===mv){
      flashZone(side==='left'?zoneL:zoneR,'flash-ok');
      clearTimeout(failTimer);
      singleSide=side;
      singleTimer=setTimeout(()=>{ singleSide=null; success(); }, SINGLE_GRACE);
    }else{
      fail('Wrong hand! It was '+LABEL[mv]+'.');
    }
  }

  function bindZone(z,side){
    z.addEventListener('touchstart',e=>{e.preventDefault();ensureAudio();input(side);},{passive:false});
    z.addEventListener('mousedown',e=>{ensureAudio();input(side);});
  }
  bindZone(zoneL,'left'); bindZone(zoneR,'right');

  document.addEventListener('keydown',e=>{
    if(!playing) return;
    ensureAudio();
    if(e.key==='ArrowRight') input('right');
    else if(e.key==='ArrowLeft') input('left');
    else if(e.key===' '){
      e.preventDefault();
      if(locked) return;
      if(moveAt(moveIdx)==='both'){ flashZone(zoneL,'flash-ok'); flashZone(zoneR,'flash-ok'); success(); }
      else fail('Wrong hand! It was '+LABEL[moveAt(moveIdx)]+'.');
    }
  });

  // ---------- start / restart ----------
  function startGame(){
    ensureAudio();
    score=0; moveIdx=0; windowMs=START_WINDOW; locked=false; pendingSide=null;
    clearTimeout(singleTimer); singleSide=null;
    scoreEl.textContent='0'; bestEl.textContent=best;
    buildDots();
    Object.keys(hands).forEach(resetHand);
    stage.classList.remove('nohints');
    scrStart.classList.add('hidden'); scrOver.classList.add('hidden');
    stage.classList.add('on'); hud.classList.add('on');
    playing=true;
    setTimeout(showMove,450);
  }
  $('startBtn').addEventListener('click',startGame);
  $('againBtn').addEventListener('click',startGame);
})();
</script>
</body>
</html>
